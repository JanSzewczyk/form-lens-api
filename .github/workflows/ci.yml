name: CI ✅

# Pushes to main and pull requests; a branch without a pull request runs CI from the Actions tab
# (workflow_dispatch). Running on every push too would test each pull request commit twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # new advisories appear without a new commit

permissions:
  contents: read

# The event is part of the group, so the weekly run never cancels a push to main or the other way
# round; only a newer commit of the same pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.7"

jobs:
  check:
    name: Check ✅
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv 🐍
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies ⚙️
        run: uv sync --locked
      - name: Run checks ✅
        run: make check
      - name: Coverage summary 📊
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  # Apart from the checks: a new advisory fails this job, not the code checks, and both results show.
  audit:
    name: Audit 🔒
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv 🐍
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies ⚙️
        run: uv sync --locked
      - name: Audit dependencies 🔒
        run: make audit

  # Contract tooling: Spectral on the spec, oasdiff against main, Schemathesis against a live server.
  api:
    name: API contract 📜
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # api-breaking reads origin/main:openapi.json
          persist-credentials: false
      - name: Set up uv 🐍
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies ⚙️
        run: uv sync --locked --group api
      - name: Run API checks 📜
        run: make api-check

  docker:
    name: Docker 🐳
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx 🐳
        uses: docker/setup-buildx-action@v4.4.1
      - name: Build image 🏗️
        uses: docker/build-push-action@v7.4.0
        with:
          context: . # the checkout, so .dockerignore applies as in a local build
          load: true
          tags: formlens:local # the image compose.yaml runs
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image has no model: starting it with an empty models folder must fail, loudly and at once,
      # with the `model_load_failed` event that tells the operator to run `make download-models`.
      # (A model is 0.6 GB and never goes into the image or into CI.) For the same reason there is no
      # `docker compose up --wait` here: without a model the service never becomes healthy.
      - name: The image refuses to start without the model 🚫
        run: |
          mkdir "$RUNNER_TEMP/empty-models"
          status=0
          timeout 120 docker run --rm --read-only --tmpfs /tmp \
            --volume "$RUNNER_TEMP/empty-models:/models:ro" --env MODELS_PATH=/models \
            formlens:local > "$RUNNER_TEMP/start.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/start.log"
          # Separate lines: under `bash -e` a failed `test` in the middle of an `&&` list does not stop the step.
          test "$status" -ne 0 # it failed
          test "$status" -ne 124 # on its own, not by hanging until the timeout
          grep --quiet model_load_failed "$RUNNER_TEMP/start.log"
      # The start-up check above stops at `missing_model_files`, before any Docling import, so it passes
      # even if the image cannot import Docling or torch. This is the step that proves the image can.
      # It runs without --read-only, --tmpfs and the models mount, so it shows no failure that only the
      # read-only container causes.
      - name: The image can import Docling and torch 📦
        run: docker run --rm formlens:local python -c "import docling.document_converter, torch"
      - name: Validate compose.yaml 🧾
        run: docker compose config --quiet # compose.yaml is valid, with its defaults

  # Informational: the free-threaded build exposes races the GIL hides. Never blocks a merge.
  # Switched off: `uv sync --locked --python 3.15t` cannot install the runtime dependencies. torch and mlx
  # have free-threaded wheels, but `av` (abi3 wheels only, and its sdist needs pkg-config), `docling-parse`
  # (cp315 wheels only) and pyarrow (no Linux wheel for 3.15 at all) have none, so the job would only
  # fail. Turn it on (remove `if: false`) when `uv sync --python 3.15t` works again.
  free-threaded:
    name: Free-threaded 🧵
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv 🐍
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.15t"
      - name: Install dependencies ⚙️
        run: uv sync --locked
      - name: Run tests 🧪
        run: uv run pytest
