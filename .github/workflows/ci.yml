name: CI ✅

# Pushes to main and pull requests; a branch without a pull request runs CI from the Actions tab
# (workflow_dispatch). Running on every push too would test each pull request commit twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # new advisories appear without a new commit

permissions:
  contents: read

# The event is part of the group, so the weekly run never cancels a push to main or the other way
# round; only a newer commit of the same pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.7"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv 🐍
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies ⚙️
        run: uv sync --locked
      - name: Run checks ✅
        run: make check
      - name: Coverage summary 📊
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Audit dependencies 🔒
        run: make audit

  # Contract tooling: Spectral on the spec, oasdiff against main, Schemathesis against a live server.
  api:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # api-breaking reads origin/main:openapi.json
          persist-credentials: false
      - name: Set up uv 🐍
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies ⚙️
        run: uv sync --locked --group api
      - name: Run API checks 📜
        run: make api-check

  docker:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx 🐳
        uses: docker/setup-buildx-action@v4.4.1
      - name: Build image 🏗️
        uses: docker/build-push-action@v7.4.0
        with:
          context: . # the checkout, so .dockerignore applies as in a local build
          load: true
          tags: fastapi-szumplate:local # the image compose.yaml runs
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # compose.yaml runs it read-only, without capabilities and with no-new-privileges; `--wait`
      # waits for the image HEALTHCHECK.
      - name: Start with Compose 🐳
        run: docker compose up --detach --no-build --wait --wait-timeout 90
      - name: Call /health 🩺
        run: curl --silent --show-error --fail --retry 3 --retry-all-errors http://127.0.0.1:8000/health
      - name: Show Compose logs 📋
        if: failure()
        run: docker compose logs

  # begin:template
  # Proves that a project made from the template passes its own `make check`, with and without
  # the example. The same script runs locally as `make smoke-template`.
  template-smoke:
    name: Template smoke 🧪
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: ["", "--rename-only"]
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv 🐍
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Run smoke test 🧪
        run: scripts/smoke_template.sh ${{ matrix.variant }}

  # end:template
  # Informational: the free-threaded build exposes races the GIL hides. Never blocks a merge.
  free-threaded:
    name: Free-threaded 🧵
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv 🐍
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.15t"
      - name: Install dependencies ⚙️
        run: uv sync --locked
      - name: Run tests 🧪
        run: uv run pytest
