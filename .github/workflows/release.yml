name: Release 🚀

# `main` only takes changes through a pull request, so a release is two pushes to main:
#
# 1. A push with releasable Conventional Commits (feat, fix, perf or a breaking change): python-semantic-release
#    works out the next version, bumps pyproject.toml, refreshes uv.lock and CHANGELOG.md, and this workflow
#    opens or updates one pull request "chore(release): X.Y.Z" on the branch release/next.
# 2. Merging that pull request (squash or rebase, not a merge commit) is a push whose subject starts with `chore(release): `: this workflow tags that
#    commit vX.Y.Z and creates the GitHub Release. Tags are not covered by the branch ruleset.
#
# No releasable commit, no pull request. Needs "Allow GitHub Actions to create and approve pull requests"
# (Settings > Actions > General). A pull request opened with GITHUB_TOKEN does not start other workflows.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  UV_VERSION: "0.13.7"

jobs:
  release:
    name: Release 🚀
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the release branch and the tag, create the GitHub Release
      pull-requests: write # open and update the release pull request
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # the tags and the commit history decide the next version
      - name: Set up uv 🐍
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies ⚙️
        run: uv sync --locked --group release
      - name: Decide what to do 🔍
        id: mode
        run: |
          if git log -1 --format=%s | grep -q '^chore(release): '; then
            echo "mode=tag" >> "$GITHUB_OUTPUT"
          else
            echo "mode=pr" >> "$GITHUB_OUTPUT"
          fi
      - name: Tag and create the GitHub Release 🏷️
        if: steps.mode.outputs.mode == 'tag'
        run: uv run semantic-release version --no-commit --tag --push --vcs-release --no-changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare the release 📦
        id: prepare
        if: steps.mode.outputs.mode == 'pr'
        run: |
          next="$(uv run semantic-release version --print)"
          last="$(uv run semantic-release version --print-last-released)"
          if [ "$next" = "$last" ]; then
            echo "Nothing to release."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          uv run semantic-release version --no-commit --no-tag --no-push --no-vcs-release
          echo "version=$next" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Open the release pull request 🔀
        if: steps.prepare.outputs.version != ''
        uses: peter-evans/create-pull-request@v8.1.3
        with:
          branch: release/next
          base: main
          commit-message: "chore(release): ${{ steps.prepare.outputs.version }}"
          title: "chore(release): ${{ steps.prepare.outputs.version }}"
          body: |
            Release ${{ steps.prepare.outputs.version }}, generated from the Conventional Commits since the last tag.

            Merge it with squash or rebase, not a merge commit, so the subject stays `chore(release): ${{ steps.prepare.outputs.version }}`:
            the next run tags the merge commit v${{ steps.prepare.outputs.version }} and creates the GitHub Release.
          delete-branch: true
