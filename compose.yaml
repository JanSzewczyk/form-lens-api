services:
  api:
    build: .
    image: fastapi-szumplate:local
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the container the server must listen on every interface and on the exposed port.
      HOST: 0.0.0.0
      PORT: "8000"
      ENVIRONMENT: production
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
