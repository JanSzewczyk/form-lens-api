[project]
name = "formlens"
version = "0.1.0"
description = "FormLens API: extracts structured data from forms with a locally running document model"
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
# A deployable service: the classifier makes PyPI refuse an accidental upload.
classifiers = ["Private :: Do Not Upload"]
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "docling[vlm]>=2.149.0",
    "fastapi>=0.162.2",
    "httpx2>=2.16.0",
    "jsonschema>=4.26.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "structlog>=26.1.0",
    # Docling needs them already. Listed here because `[tool.uv.sources]` applies to direct dependencies
    # only: it keeps Linux off the CUDA build of torch (see the sources below).
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
formlens = "formlens.__main__:cli"

[build-system]
requires = ["hatchling>=1.27,<2"]  # 1.27 reads the PEP 639 `license` expression
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formlens"]

[dependency-groups]
api = [
    "schemathesis>=4.33.1",
]
dev = [
    "import-linter>=2.16",
    "mypy>=2.4.1",
    "ruff>=0.17.4",
    "types-jsonschema>=4.26.0.20261006",
]
release = [
    "python-semantic-release>=10",
]
test = [
    "coverage>=7.17.2",
    "factory-boy>=3.3.3",
    "hypothesis>=6.170.15",
    "pytest>=9.2.0",
    "pytest-randomly>=5.0.0",
    "pytest-timeout>=2.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py315"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "S", "G", "LOG", "T20", "TRY", "PT", "D", "PTH", "FURB", "TD",
    "RUF", "FAST", "ASYNC", "BLE", "C4", "SIM", "RET", "PIE", "PERF", "PGH", "RSE", "FLY", "ISC", "A",
    "PLE", "PLW", "ARG", "DTZ",
]
# TRY003: a short message at the raise site is clearer than an exception class per message.
# TRY004: Pydantic validators must raise ValueError, never TypeError.
ignore = ["TRY003", "TRY004"]

[tool.ruff.lint.isort]
known-first-party = ["formlens", "tests", "scripts"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S105", "S106", "ARG"]  # ARG: fixtures requested for their effect
"scripts/**" = ["T201", "D"]
"tests/golden/evaluate.py" = ["T201"]  # prints the table `make evaluate` shows

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "possibly-undefined",
    "deprecated",
    "mutable-override",
    "unused-awaitable",
    "exhaustive-match",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "9.2"
testpaths = ["tests"]
# `slow` tests need the downloaded models; `make test-models` runs them (-m slow, the last -m wins).
addopts = "-ra -m \"not slow\""
# strict_config, strict_markers, strict_parametrization_ids and strict_xfail.
strict = true
# A deprecation or resource warning is a failure, not noise in the summary.
filterwarnings = ["error"]
# pytest-randomly is not required: `-p no:randomly` turns it off to replay a run in file order.
required_plugins = ["pytest-timeout>=2.4"]
timeout = 60
markers = [
    "slow: tests that need the downloaded models; deselected by default, run with make test-models",
    "concurrency: tests that fire competing requests in parallel to prove an atomic guard",
]

[tool.uv]
required-version = ">=0.13.7"
default-groups = ["dev", "test"]

# On Linux, torch from PyPI pulls the CUDA stack (15 nvidia-* packages, cuda-toolkit, triton: about
# 3 GB of wheels). The service runs on a CPU there, so Linux takes the CPU wheels (about 210 MB);
# macOS and Windows keep PyPI's torch.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.coverage.run]
branch = true
# Directories, not package names: Alembic runs `env.py` and the revision scripts under module names of its
# own (`env`, `v0001_initial`), which a package name would not match, so they would count as never run.
source_dirs = ["src/formlens", "scripts", "tests/golden"]
# The golden set's code (generator, scoring, `make evaluate`) is measured; its test files are not.
omit = ["tests/golden/test_*.py"]

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.importlinter]
root_package = "formlens"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The core is layered: entry point, factory, features, foundations"
type = "layers"
layers = [
    "formlens.__main__",
    "formlens.main",
    "formlens.migrations",
    "formlens.extractions",
    "formlens.health | formlens.middleware | formlens.openapi | formlens.logging_config | formlens.parsing | formlens.templates",
    "formlens.pagination | formlens.database",
    "formlens.problems | formlens.config | formlens.query | formlens.types | formlens.patterns",
    "formlens.modelspec",
]

[[tool.importlinter.contracts]]
name = "Only the entry point imports the web server"
type = "forbidden"
source_modules = [
    "formlens.main",
    "formlens.config",
    "formlens.database",
    "formlens.extractions",
    "formlens.health",
    "formlens.logging_config",
    "formlens.middleware",
    "formlens.migrations",
    "formlens.modelspec",
    "formlens.openapi",
    "formlens.pagination",
    "formlens.parsing",
    "formlens.patterns",
    "formlens.problems",
    "formlens.query",
    "formlens.templates",
    "formlens.types",
]
forbidden_modules = ["uvicorn"]

[[tool.importlinter.contracts]]
name = "Only the persistence modules import SQLAlchemy"
type = "forbidden"
source_modules = ["formlens"]
forbidden_modules = ["sqlalchemy"]
# The doors: the database module, the migrations and the table and repository modules of each feature.
# A chain through them (main -> database -> sqlalchemy) goes away with these edges.
ignore_imports = [
    "formlens.database -> sqlalchemy",
    "formlens.migrations -> sqlalchemy",
    "formlens.migrations.versions.** -> sqlalchemy",
    "formlens.templates.repository -> sqlalchemy",
    "formlens.templates.tables -> sqlalchemy",
    "formlens.extractions.adapters.tables -> sqlalchemy",
    "formlens.extractions.adapters.sqlite_repository -> sqlalchemy",
]

[[tool.importlinter.contracts]]
name = "Only the Ollama adapter imports the HTTP client and the JSON Schema validator"
type = "forbidden"
source_modules = ["formlens"]
forbidden_modules = ["httpx2", "httpx", "jsonschema"]
ignore_imports = [
    "formlens.extractions.adapters.ollama_extractor -> httpx2",
    "formlens.extractions.adapters.ollama_extractor -> jsonschema",
]

[[tool.importlinter.contracts]]
name = "Only the migrations import Alembic"
type = "forbidden"
source_modules = ["formlens"]
forbidden_modules = ["alembic"]
ignore_imports = [
    "formlens.migrations -> alembic",
    "formlens.migrations.env -> alembic",
    "formlens.migrations.versions.** -> alembic",
]


[[tool.importlinter.contracts]]
name = "Only the Docling adapter imports the document stack"
type = "forbidden"
source_modules = ["formlens"]
forbidden_modules = ["docling", "torch", "transformers", "mlx_vlm", "PIL"]
# The one door: the adapter imports Docling inside build_docling_parser. A chain through it from main
# goes away with this edge, so the adapter does not make every module that imports it a violation.
ignore_imports = ["formlens.parsing.docling_parser -> docling"]

[[tool.importlinter.contracts]]
name = "Parsing is layered: router, dependencies, service, then ports, slots and models, then exceptions"
type = "layers"
layers = [
    "formlens.parsing.router",
    "formlens.parsing.dependencies",
    "formlens.parsing.service",
    "formlens.parsing.slots | formlens.parsing.ports | formlens.parsing.models",
    "formlens.parsing.exceptions",
]

[[tool.importlinter.contracts]]
name = "Templates are layered: router, dependencies and schemas, service, storage, then models and exceptions"
type = "layers"
layers = [
    "formlens.templates.router",
    "formlens.templates.dependencies | formlens.templates.schemas | formlens.templates.errors",
    "formlens.templates.service",
    "formlens.templates.repository | formlens.templates.json_schema",
    "formlens.templates.tables | formlens.templates.models",
    "formlens.templates.exceptions",
]

[[tool.importlinter.contracts]]
name = "Extractions are layered: entry points, then the service layer and the adapters, then the domain"
type = "layers"
layers = [
    "formlens.extractions.entrypoints",
    "formlens.extractions.service_layer | formlens.extractions.adapters",
    "formlens.extractions.domain",
]

[[tool.importlinter.contracts]]
name = "The extraction domain and service layer import no framework, database, client or adapter"
type = "forbidden"
source_modules = ["formlens.extractions.domain", "formlens.extractions.service_layer"]
forbidden_modules = [
    "sqlalchemy",
    "fastapi",
    "starlette",
    "httpx2",
    "alembic",
    "jsonschema",
    "formlens.extractions.adapters",
]

[[tool.importlinter.contracts]]
name = "Only the application factory imports the Docling adapter"
type = "forbidden"
# Listed one by one: a source that contains the forbidden module (`formlens` itself) makes the check
# find nothing. `formlens.main` and `formlens.__main__` are left out on purpose: main is the door.
# `tests/test_tooling.py` fails when a module of the package is neither listed here nor left out.
source_modules = [
    "formlens.config",
    "formlens.database",
    "formlens.extractions",
    "formlens.health",
    "formlens.logging_config",
    "formlens.middleware",
    "formlens.migrations",
    "formlens.modelspec",
    "formlens.openapi",
    "formlens.pagination",
    "formlens.parsing.body_limit",
    "formlens.parsing.dependencies",
    "formlens.parsing.errors",
    "formlens.parsing.exceptions",
    "formlens.parsing.models",
    "formlens.parsing.ports",
    "formlens.parsing.router",
    "formlens.parsing.schemas",
    "formlens.parsing.service",
    "formlens.parsing.slots",
    "formlens.patterns",
    "formlens.problems",
    "formlens.query",
    "formlens.templates",
    "formlens.types",
]
forbidden_modules = ["formlens.parsing.docling_parser"]

# Releases: python-semantic-release reads Conventional Commits on main, bumps `version` above,
# refreshes uv.lock, tags `vX.Y.Z` and creates the GitHub Release (see .github/workflows/release.yml).
# CHANGELOG.md is generated by the first release.
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_message = "chore(release): {version}"
allow_zero_version = true
major_on_zero = false
build_command = "uv lock --upgrade-package formlens && git add uv.lock"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "docs", "style", "refactor", "test", "build", "ci", "chore"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
