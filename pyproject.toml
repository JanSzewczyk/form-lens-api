[project]
name = "formlens"
version = "0.1.0"
description = "FormLens API: extracts structured data from forms with a locally running document model"
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
# A deployable service: the classifier makes PyPI refuse an accidental upload.
classifiers = ["Private :: Do Not Upload"]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.2",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
formlens = "formlens.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]  # 1.27 reads the PEP 639 `license` expression
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formlens"]

[dependency-groups]
api = [
    "schemathesis>=4.33.1",
]
dev = [
    "import-linter>=2.16",
    "mypy>=2.4.1",
    "ruff>=0.17.4",
]
release = [
    "python-semantic-release>=10",
]
test = [
    "coverage>=7.17.2",
    "factory-boy>=3.3.3",
    "httpx2>=2.16.0",
    "hypothesis>=6.170.15",
    "pytest>=9.2.0",
    "pytest-randomly>=5.0.0",
    "pytest-timeout>=2.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py315"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "S", "G", "LOG", "T20", "TRY", "PT", "D", "PTH", "FURB", "TD",
    "RUF", "FAST", "ASYNC", "BLE", "C4", "SIM", "RET", "PIE", "PERF", "PGH", "RSE", "FLY", "ISC", "A",
    "PLE", "PLW", "ARG", "DTZ",
]
# TRY003: a short message at the raise site is clearer than an exception class per message.
# TRY004: Pydantic validators must raise ValueError, never TypeError.
ignore = ["TRY003", "TRY004"]

[tool.ruff.lint.isort]
known-first-party = ["formlens", "tests", "scripts"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S105", "S106", "ARG"]  # ARG: fixtures requested for their effect
"scripts/**" = ["T201", "D"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "possibly-undefined",
    "deprecated",
    "mutable-override",
    "unused-awaitable",
    "exhaustive-match",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "9.2"
testpaths = ["tests"]
# `slow` tests need the downloaded models; `make test-models` runs them (-m slow, the last -m wins).
addopts = "-ra -m \"not slow\""
# strict_config, strict_markers, strict_parametrization_ids and strict_xfail.
strict = true
# A deprecation or resource warning is a failure, not noise in the summary.
filterwarnings = ["error"]
# pytest-randomly is not required: `-p no:randomly` turns it off to replay a run in file order.
required_plugins = ["pytest-timeout>=2.4"]
timeout = 60
markers = [
    "slow: tests that need the downloaded models; deselected by default, run with make test-models",
    "concurrency: tests that fire competing requests in parallel to prove an atomic guard",
]

[tool.uv]
required-version = ">=0.13.7"
default-groups = ["dev", "test"]

[tool.coverage.run]
branch = true
source = ["formlens", "scripts"]

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.importlinter]
root_package = "formlens"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The core is layered: entry point, factory, features, foundations"
type = "layers"
layers = [
    "formlens.__main__",
    "formlens.main",
    "formlens.health | formlens.middleware | formlens.openapi | formlens.logging_config | formlens.pagination",
    "formlens.problems | formlens.config | formlens.query | formlens.types",
]

[[tool.importlinter.contracts]]
name = "Only the entry point imports the web server"
type = "forbidden"
source_modules = [
    "formlens.main",
    "formlens.config",
    "formlens.health",
    "formlens.logging_config",
    "formlens.middleware",
    "formlens.openapi",
    "formlens.pagination",
    "formlens.problems",
    "formlens.query",
    "formlens.types",
]
forbidden_modules = ["uvicorn"]

# Releases: python-semantic-release reads Conventional Commits on main, bumps `version` above,
# refreshes uv.lock, tags `vX.Y.Z` and creates the GitHub Release (see .github/workflows/release.yml).
# CHANGELOG.md is generated by the first release.
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_message = "chore(release): {version}"
allow_zero_version = true
major_on_zero = false
build_command = "uv lock --upgrade-package formlens && git add uv.lock"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "docs", "style", "refactor", "test", "build", "ci", "chore"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
