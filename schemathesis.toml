# Read by `schemathesis run` from the working directory.
[phases.stateful]
max-steps = 50

# The file part is a string of any bytes in the schema; what the schema cannot say is that the service
# types the file by its signature (a PDF, PNG, JPEG or TIFF) and answers 415 to anything else. This is
# the rejection Schemathesis allows an operation to declare (`st explain ST202`); the check itself and
# every phase stay on, and the other statuses of the default list stay as they are.
[[operations]]
include-name = "POST /v1/documents/parse"
checks.positive_data_acceptance.expected-statuses = ["2xx", "3xx", "401", "403", "404", "409", "429", "5xx", "415"]

# A template is valid only if its fields agree with their types (a choice has values, a range fits a number),
# names are unique and the pattern compiles. A flat JSON Schema cannot say that, so a schema-valid body can
# be answered with 422 `invalid-template`. This is the rejection the operation declares (`st explain ST202`);
# the check itself and every phase stay on, and the other statuses of the default list stay as they are.
[[operations]]
include-name = "POST /v1/templates"
checks.positive_data_acceptance.expected-statuses = ["2xx", "3xx", "401", "403", "404", "409", "429", "5xx", "422"]

[[operations]]
include-name = "PUT /v1/templates/{template_id}"
checks.positive_data_acceptance.expected-statuses = ["2xx", "3xx", "401", "403", "404", "409", "429", "5xx", "422"]

# The same as for the parse endpoint: the file part is any bytes in the schema, and the service answers 415 to
# what is not a PDF, PNG, JPEG or TIFF. A 422 `invalid-template` is not possible here; an unknown `template_id`
# is a 404, which the default list already accepts.
[[operations]]
include-name = "POST /v1/extractions"
checks.positive_data_acceptance.expected-statuses = ["2xx", "3xx", "401", "403", "404", "409", "429", "5xx", "415"]
